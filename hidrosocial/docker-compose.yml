x-app: &app
  image: calidad-web:${CALIDAD_IMAGE_TAG:-local}
  build: .
  environment: &app-environment
    VAULT_PATH: /vault
    PORT: '3000'
    # El acceso viaja desde .env tal cual: construir es el único paso. Si el
    # secreto o la clave del root llegan vacíos el servicio arranca cerrado
    # —nadie entra— y /acceso dice qué falta, en vez de abortar la construcción.
    SESSION_SECRET: ${SESSION_SECRET:-}
    ROOT_USUARIO: ${ROOT_USUARIO:-root}
    ROOT_CORREO: ${ROOT_CORREO:-}
    ROOT_CLAVE: ${ROOT_CLAVE:-}
    ROOT_CLAVE_HASH: ${ROOT_CLAVE_HASH:-}
    SESION_HORAS: ${SESION_HORAS:-8}
    AUTH_USUARIOS: ${AUTH_USUARIOS:-}
    CONFIAR_PROXY: ${CONFIAR_PROXY:-0}
    # Correo: dentro del contenedor `localhost` es el propio contenedor, así que
    # el relay del anfitrión se alcanza por host.docker.internal (ver extra_hosts).
    CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@calidad.local}
    CORREO_DOMINIO: ${CORREO_DOMINIO:-calidad.local}
    CORREO_ENVIAR: ${CORREO_ENVIAR:-1}
    SMTP_HOST: ${SMTP_HOST_DOCKER:-host.docker.internal}
    SMTP_PORT: ${SMTP_PORT:-25}
    PGHOST: db
    PGPORT: '5432'
    PGUSER: ${POSTGRES_USER:-calidad}
    PGDATABASE: ${POSTGRES_DB:-calidad}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
  extra_hosts:
    # En Linux `host.docker.internal` no existe por omisión; esto lo define.
    - 'host.docker.internal:host-gateway'
  volumes:
    # El contenido base se consulta; las nuevas aportaciones viven en PostgreSQL.
    - ../:/vault:ro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calidad}
      POSTGRES_USER: ${POSTGRES_USER:-calidad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo accesible desde la red interna de Compose.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *app
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  calidad:
    <<: *app
    container_name: calidad-web
    restart: unless-stopped
    ports:
      - '3005:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:3000/calidad/healthcheck').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
